<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - MyNotes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styleDashboard.css">
  
</head>
<body>

  <!--Navigation Bar-->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">MyNotes ✨</a>
      <div class="d-flex">
        <button id="logoutBtn" class="btn btn-logout fw-bold">Logout 👋</button>
      </div>
    </div>
  </nav>

  <div class="container mt-5">
    <!--Welcomee Area-->
    <div class="text-center mb-5">
        <h1 class="text-primary fw-bold display-5" id="welcomeMessage">Welcome!</h1>
        <p class="text-secondary fs-5">What's on your mind today?</p>
    </div>

    <!--Writing Note Area-->
    <div class="row justify-content-center mb-5">
      <div class="col-md-10 col-lg-8">
        <div class="glass-card p-4">
          <h4 class="text-primary fw-bold mb-4">Create a New Note</h4>
          <form id="createNoteForm">
            <div class="mb-3">
              <label for="noteTitle" class="form-label text-dark fw-bold ms-2">Title</label>
              <input type="text" class="form-control glass-input" id="noteTitle" placeholder="My Awesome Idea..." required>
            </div>
            <div class="mb-4">
              <label for="noteContent" class="form-label text-dark fw-bold ms-2">Content</label>
              <!--resizable-textarea-->
              <textarea class="form-control glass-input resizable-textarea" id="noteContent" placeholder="Type your thoughts here. You can drag the bottom-right corner to resize me! ↘️" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold btn-pill shadow-sm">Save Note 🚀</button>
          </form>
          <div id="noteMessageBox" class="mt-3 text-center fw-bold"></div>
        </div>
      </div>
    </div>

    <!--Saved Notes Area-->
    <div class="row justify-content-center">
      <div class="col-12">
        <hr class="text-primary opacity-25 mb-5">
        <h3 class="text-primary fw-bold text-center mb-4">📚 Your Saved Notes</h3>
      </div>
      <div class="col-md-11 col-lg-10">
        <div class="row" id="notesContainer"></div>
      </div>
    </div>
  </div>
  
  <!--View Note-->
  <div class="modal fade" id="viewNoteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content glass-card border-0 shadow-lg" style="border-radius: 1.5rem;">
        <div class="modal-header bg-primary text-white" style="border-radius: 1.5rem 1.5rem 0 0;">
          <h5 class="modal-title fw-bold" id="viewNoteTitle">Note Title</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <p class="text-dark" id="viewNoteContent" style="white-space: pre-wrap; font-size: 1.1rem; line-height: 1.7;"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Note-->
  <div class="modal fade" id="editNoteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content glass-card border-0 shadow-lg" style="border-radius: 1.5rem;">
        <div class="modal-header bg-primary text-white" style="border-radius: 1.5rem 1.5rem 0 0;">
          <h5 class="modal-title fw-bold">Edit Note ✨</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <form id="editNoteForm">
            <input type="hidden" id="editNoteId">
            <div class="mb-3">
              <label class="form-label text-dark fw-bold ms-2">Title</label>
              <input type="text" class="form-control glass-input" id="editNoteTitle" required>
            </div>
            <div class="mb-4">
              <label class="form-label text-dark fw-bold ms-2">Content</label>
              <textarea class="form-control glass-input resizable-textarea" id="editNoteContent" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold btn-pill">Save Changes</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
