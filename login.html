<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MyNotes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styleLogin.css">
  
</head>
<body>

  <div class="glass-card">
    <div class="text-center mb-4">
      <h2 class="text-primary fw-bold">Login Form</h2>
      <p class="text-secondary">Welcome back to MyNotes</p>
    </div>
    
    <form id="loginForm">
      <div class="mb-3">
        <label for="loginUsername" class="form-label text-dark fw-bold ms-3">Username</label>
        <input type="text" class="form-control pill-input" id="loginUsername" required>
      </div>
      
      <div class="mb-4">
        <label for="loginPassword" class="form-label text-dark fw-bold ms-3">Password</label>
        <input type="password" class="form-control pill-input" id="loginPassword" required>
      </div>
      
      <button type="submit" class="btn btn-primary w-100 fw-bold btn-pill mt-2">Log In</button>
    </form>
    
    <div id="loginMessageBox" class="mt-3 text-center fw-bold"></div>
    
    <div class="text-center mt-4">
        <small class="text-secondary">Don't have an account? <a href="register.html" class="text-primary fw-bold text-decoration-none">Register</a></small>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
