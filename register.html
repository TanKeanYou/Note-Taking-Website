<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - MyNotes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styleRegister.css">
  
</head>
<body>

  <div class="glass-card">
    
    <div class="text-center mb-4">
      <h2 class="text-primary fw-bold">Create Account</h2>
      <p class="text-secondary">Join MyNotes today</p>
    </div>
    
    <form id="registerForm">
      <div class="mb-3">
        <label for="username" class="form-label text-dark fw-bold ms-3">Username</label>
        <input type="text" class="form-control pill-input" id="username" required>
      </div>
      
      <div class="mb-4">
        <label for="password" class="form-label text-dark fw-bold ms-3">Password</label>
        <input type="password" class="form-control pill-input" id="password" required>
      </div>
      
      <button type="submit" class="btn btn-primary w-100 fw-bold btn-pill mt-2">Register Now</button>
    </form>
    
    <div id="messageBox" class="mt-3 text-center fw-bold"></div>
    
    <div class="text-center mt-4">
        <small class="text-secondary">Already have an account? <a href="login.html" class="text-primary fw-bold text-decoration-none">Log In</a></small>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
